name: API documentation format checks
on:
  workflow_dispatch:
  push:
    branches: [main, feat/qwen-docs-ci]
    paths:
      - 'src/main/**'
      - 'config/api-docs-*'
      - 'scripts/api_docs.py'
      - 'scripts/check_api_docs.py'
      - 'scripts/api_docs_pipeline.py'
      - 'scripts/api_docs_tokens.py'
      - 'scripts/serverless_docs.py'
      - 'tests/api_docs_fixture.py'
      - 'tests/test_api_docs.py'
      - 'tests/test_api_docs_pipeline.py'
      - '.github/workflows/api-docs.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: api-docs
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install locked document validators in a virtual environment
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/python -m pip install --require-hashes -r config/api-docs-requirements.txt
      - name: Build app and check document contracts without GPU
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          ./scripts/verify-all.sh
          .venv-docs/bin/python tests/test_api_docs.py --smoke-out generated/api-docs-synthetic
          .venv-docs/bin/python tests/test_api_docs_pipeline.py --smoke-out generated/api-docs-loop-synthetic
          .venv-docs/bin/python scripts/api_docs.py prepare --out generated/api-docs-prepared
      - name: Save explicitly synthetic preview and local API check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-docs-synthetic-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            generated/api-docs-synthetic/
            generated/api-docs-loop-synthetic/
            generated/api-docs-prepared/manifest.json
          if-no-files-found: warn
          retention-days: 7
  generate:
    needs: offline
    if: vars.RUNPOD_API_DOCS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install document validators and build the local API fixture
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/python -m pip install --require-hashes -r config/api-docs-requirements.txt
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          ./dev build
      - name: Restore a previous live candidate when explicitly selected
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_RESUME_RUN: ${{ vars.RUNPOD_API_DOCS_RESUME_RUN }}
        run: |
          if [[ -n "$DOCS_RESUME_RUN" ]]; then
            [[ "$DOCS_RESUME_RUN" =~ ^[0-9]+$ ]]
            mkdir -p generated
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DOCS_RESUME_RUN" \
              --jq '{id,head_sha,status,path,run_attempt,html_url}' > generated/resume-origin.json
            jq -e '.status == "completed" and .path == ".github/workflows/api-docs.yml"' generated/resume-origin.json
            run_sha=$(jq -r .head_sha generated/resume-origin.json)
            run_attempt=$(jq -r .run_attempt generated/resume-origin.json)
            gh run download "$DOCS_RESUME_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "api-docs-live-$run_sha-$run_attempt" --dir generated/api-docs-resume
            mv generated/resume-origin.json generated/api-docs-resume/ci-origin.json
          fi
      - name: Generate, check, review, repair and recheck API documentation
        env:
          RUNPOD_ENDPOINT_ID: ${{ vars.RUNPOD_ENDPOINT_ID }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          DOCS_SCOPE: ${{ vars.RUNPOD_API_DOCS_SCOPE || 'auth-create' }}
          DOCS_MAX_JOBS: ${{ vars.RUNPOD_API_DOCS_MAX_JOBS || '8' }}
          DOCS_TOTAL_SECONDS: ${{ vars.RUNPOD_API_DOCS_TOTAL_SECONDS || '720' }}
          DOCS_MAX_REPAIRS: ${{ vars.RUNPOD_API_DOCS_MAX_REPAIRS || '1' }}
          DOCS_REPAIR_FORMAT: ${{ vars.RUNPOD_API_DOCS_REPAIR_FORMAT || 'document' }}
          DOCS_RESUME_RUN: ${{ vars.RUNPOD_API_DOCS_RESUME_RUN }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          extra_args=()
          if [[ -n "$DOCS_RESUME_RUN" ]]; then
            extra_args+=(--resume-from generated/api-docs-resume)
          fi
          if [[ -f config/api-docs-feedback.json ]]; then
            extra_args+=(--findings config/api-docs-feedback.json)
          fi
          .venv-docs/bin/python scripts/api_docs_pipeline.py --live \
            --scope "$DOCS_SCOPE" --max-jobs "$DOCS_MAX_JOBS" \
            --max-repairs "$DOCS_MAX_REPAIRS" --total-seconds "$DOCS_TOTAL_SECONDS" \
            --repair-format "$DOCS_REPAIR_FORMAT" \
            "${extra_args[@]}" --out generated/api-docs-live
      - name: Preserve candidate documents and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-docs-live-${{ github.sha }}-${{ github.run_attempt }}
          path: generated/api-docs-live/
          if-no-files-found: warn
          retention-days: 7
